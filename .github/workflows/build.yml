name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: |
          xcodebuild \
            -project codex-menu-quota.xcodeproj \
            -scheme codex-menu-quota \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
