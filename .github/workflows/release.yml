name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build DMG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          VERSION="$VERSION" ./scripts/build-dmg.sh
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create checksum
        run: |
          cd dist
          shasum -a 256 "codex-menu-quota-${RELEASE_VERSION}.dmg" > "codex-menu-quota-${RELEASE_VERSION}.dmg.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/codex-menu-quota-${RELEASE_VERSION}.dmg" \
            "dist/codex-menu-quota-${RELEASE_VERSION}.dmg.sha256" \
            --verify-tag \
            --generate-notes \
            --title "codex-menu-quota ${RELEASE_VERSION}"
